name: Compilar APK Android con firma fija

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xiankaishan4-commits/Registro-Temperaturas' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Leer versión única de Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          gradle = pathlib.Path('app/build.gradle').read_text()
          version = re.search(r"versionName '(\d+\.\d+\.\d+)'", gradle).group(1)
          code = re.search(r'versionCode (\d+)', gradle).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APP_VERSION={version}\nAPP_VERSION_CODE={code}\n')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager no encontrado" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Integrar ExcelJS local para uso offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js' \
            --output app/src/main/assets/vendor/exceljs.min.js
          test "$(wc -c < app/src/main/assets/vendor/exceljs.min.js)" -gt 500000
          node -e "const E=require('./app/src/main/assets/vendor/exceljs.min.js'); if(!E.Workbook) process.exit(1)"
          sha256sum app/src/main/assets/vendor/exceljs.min.js

      - name: Comprobar JavaScript
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/updates.js
          node --check app/src/main/assets/records-core.js
          node --check app/src/main/assets/report-core.js
          node --check app/src/main/assets/excel-core.js

      - name: Probar reglas de historial e informes
        run: |
          node tests/test_company_settings.cjs
          node tests/test_records_core.cjs
          node tests/test_updates.cjs
          node tests/test_report_core.cjs
          node tests/test_excel_core.cjs

      - name: Validar estructura y compatibilidad
        run: python3 -m unittest discover -s tests -v

      - name: Probar formularios, historial y restauración ZIP en Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rt-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/rt-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/rt-browser/node_modules" node tests/test_temperature_app.cjs

      # All secret values are available only within the runner, never committed.
      - name: Validar GitHub Secrets de firma
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Falta GitHub Actions Secret: $key (consulte SIGNING_SETUP.md)"
              exit 1
            fi
          done
          echo "Los 4 GitHub Actions Secrets están configurados."

      - name: Restaurar keystore temporal
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.p12"
          test -s "$RUNNER_TEMP/android-signing/release.p12" || exit 1
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android-signing/release.p12" >> "$GITHUB_ENV"

      - name: Compilar APK release firmado con clave permanente
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verificar firma y certificado permanente
        shell: bash
        env:
          EXPECTED_CERT_SHA256: CA948872880E588B54F63077AC25BDDCC13CE8C5126CBC38AF27DC26B30129CA
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          INFO=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK certificate fingerprint does not match registered signing identity"
            exit 1
          fi
          echo "APK signature verified: $ACTUAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import os, pathlib, re
          line = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-badging.txt').read_text().splitlines()[0]
          attrs = dict(re.findall(r"(\w+)='([^']*)'", line))
          assert attrs['name'] == 'com.shanfoodsgroup.temperaturas'
          assert attrs['versionName'] == os.environ['APP_VERSION']
          assert attrs['versionCode'] == os.environ['APP_VERSION_CODE']
          print('Verified APK metadata:', line)
          PY
          cp "$APK" "$RUNNER_TEMP/Registro_Temperaturas_v${APP_VERSION}_Firmado.apk"

      - name: Publicar solo APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: Registro_Temperaturas_APK_Firmado_v${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/Registro_Temperaturas_v${{ env.APP_VERSION }}_Firmado.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release oficial y verificar descarga pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py

      - name: Borrar keystore temporal
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-signing/release.p12"
